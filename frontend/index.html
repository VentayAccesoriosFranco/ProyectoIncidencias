<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Reportes e Incidencias</title>

    <link rel="stylesheet" href="CSS/estilos.css?v=52">
    <link rel="stylesheet" href="CSS/paneles.css?v=52">
</head>

<body>

    <header>
        <h1>Reportes e Incidencias</h1>
        <p>Plataforma de reporte de problemas de infraestructura</p>
    </header>

    <main>

        <section class="seccion-login">

            <h2>Bienvenido al sistema</h2>

            <p>
                Inicia sesión para acceder a las funciones
                correspondientes a tu cuenta.
            </p>

            <p id="estadoSesion">
                Comprobando sesión...
            </p>

            <button id="btnLogin" type="button" hidden>
                Iniciar sesión
            </button>

            <button id="btnLogout" type="button" hidden>
                Cerrar sesión
            </button>

            <div id="mensajeAcceso"></div>

        </section>

    </main>

    <script type="module" src="JS/login.js"></script>

</body>
</html>
