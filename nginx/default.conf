server {
    listen 80;
    server_name localhost;

    # Permite subir fotografías de hasta 10 MB (la API limita a 5 MB).
    client_max_body_size 10m;

    # La IA local (Ollama) puede tardar varios segundos en responder.
    proxy_connect_timeout 30s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;

    location /api/usuarios {
        proxy_pass http://host.docker.internal:5001;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/incidencias {
        proxy_pass http://host.docker.internal:5002;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 200 "Nginx - Plataforma de Incidencias funcionando";
        add_header Content-Type text/plain;
    }
}
